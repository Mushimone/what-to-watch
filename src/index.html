<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>What to Watch</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Your personal watchlist for movies, series and anime — with AI-powered recommendations." />

    <!-- PWA / installable -->
    <meta name="theme-color" content="#16db65" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="What to Watch" />
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Rounded — the variable-axis set. FILL is requested as a
         range (0..1) because the app toggles it to signal state. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
