<div class="watchlist-page">
  @if (isDesktop()) {
    <!-- ── Desktop: sidebar nav + single full-width content pane ──────── -->
    <div class="desktop-shell">
      <nav class="sidebar">
        <span class="sidebar-brand">What to Watch</span>

        <!-- Add is an action, not a destination — same role it has on mobile. -->
        <button
          class="rail-action"
          [class.rail-action--active]="activeSection() === 'add'"
          (click)="setSection('add')"
        >
          <mat-icon>add</mat-icon>
          <span>Add a title</span>
        </button>

        <button
          class="nav-item"
          [class.nav-item--active]="activeSection() === 'list'"
          [attr.aria-current]="activeSection() === 'list' ? 'page' : null"
          (click)="setSection('list')"
        >
          <mat-icon>video_library</mat-icon>
          <span>My list</span>
        </button>
        <button
          class="nav-item"
          [class.nav-item--active]="activeSection() === 'shared'"
          [attr.aria-current]="activeSection() === 'shared' ? 'page' : null"
          (click)="setSection('shared')"
        >
          <mat-icon>group</mat-icon>
          <span>Friends</span>
        </button>

        <!-- The AI trigger docks in the rail here instead of floating. -->
        <button class="rail-ai" (click)="chat.isOpen = !chat.isOpen">
          <mat-icon>auto_awesome</mat-icon>
          <span>Ask AI</span>
        </button>

        <button
          class="rail-account"
          [class.rail-account--active]="activeSection() === 'profile'"
          [attr.aria-current]="activeSection() === 'profile' ? 'page' : null"
          (click)="setSection('profile')"
        >
          <mat-icon>account_circle</mat-icon>
          <span class="rail-account__name">{{ username() }}</span>
        </button>
      </nav>

      <!-- Panes stay mounted and are hidden, not destroyed: switching sections
           would otherwise re-run every load and flash an empty pane. -->
      <main class="content">
        <app-watchlist-list [hidden]="activeSection() !== 'list'"></app-watchlist-list>
        <app-watchlist-add [hidden]="activeSection() !== 'add'"></app-watchlist-add>
        <app-watchlist-shared [hidden]="activeSection() !== 'shared'"></app-watchlist-shared>
        <app-watchlist-profile [hidden]="activeSection() !== 'profile'"></app-watchlist-profile>
      </main>
    </div>
  } @else {
    <!-- ── Mobile: top bar (title/context) + scrolling pane + bottom nav ── -->
    <div class="page-header">
      <!-- Add and Profile are reached from here, not from the bottom nav, so
           they are the two that need a way back to the list. -->
      @if (activeSection() === 'add' || activeSection() === 'profile') {
        <button mat-icon-button (click)="setSection('list')" aria-label="Back">
          <mat-icon>arrow_back</mat-icon>
        </button>
      }
      <span class="page-title">{{ sectionTitle() }}</span>
      <button
        mat-icon-button
        (click)="setSection('profile')"
        [attr.aria-current]="activeSection() === 'profile' ? 'page' : null"
        aria-label="Profile"
        matTooltip="Profile"
      >
        <mat-icon>account_circle</mat-icon>
      </button>
    </div>

    <main class="mobile-content">
      <app-watchlist-list [hidden]="activeSection() !== 'list'"></app-watchlist-list>
      <app-watchlist-add [hidden]="activeSection() !== 'add'"></app-watchlist-add>
      <app-watchlist-shared [hidden]="activeSection() !== 'shared'"></app-watchlist-shared>
      <app-watchlist-profile [hidden]="activeSection() !== 'profile'"></app-watchlist-profile>
    </main>

    <!-- Add: floating action button, bottom-right. Hidden while already adding,
         and while the chat is up — it sits at z-fab and would punch a hole in
         the panel's bottom-right corner. One floating action at a time. -->
    @if (activeSection() !== 'add' && !chat.isOpen) {
      <button mat-fab class="add-fab" (click)="setSection('add')" aria-label="Add a title">
        <mat-icon>add</mat-icon>
      </button>
    }

    <nav class="bottom-nav" aria-label="Main">
      <button
        class="bottom-nav__item"
        [class.bottom-nav__item--active]="activeSection() === 'list'"
        [attr.aria-current]="activeSection() === 'list' ? 'page' : null"
        (click)="setSection('list')"
      >
        <mat-icon>video_library</mat-icon>
        <span>My list</span>
      </button>

      <!-- notch: reserves room for the centred AI button -->
      <span class="bottom-nav__notch" aria-hidden="true"></span>

      <button
        class="bottom-nav__item"
        [class.bottom-nav__item--active]="activeSection() === 'shared'"
        [attr.aria-current]="activeSection() === 'shared' ? 'page' : null"
        (click)="setSection('shared')"
      >
        <mat-icon>group</mat-icon>
        <span>Friends</span>
      </button>
    </nav>
  }

  <!-- Chat panel — its own FAB docks into the mobile notch; on desktop the rail
       button above drives it and the FAB is hidden. -->
  <app-watchlist-ai-chat #chat [mode]="chatMode"></app-watchlist-ai-chat>
</div>
