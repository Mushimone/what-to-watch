<div class="watchlist-page">
  @if (!isDesktop()) {
    <div class="page-header">
      <span class="page-title">What to Watch</span>
      <button mat-icon-button (click)="logout()" aria-label="Sign out" matTooltip="Sign out">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  }

  @if (isDesktop()) {
    <!-- ── Desktop: sidebar nav + single full-width content pane ──────── -->
    <div class="desktop-shell">
      <nav class="sidebar">
        <span class="sidebar-brand">What to Watch</span>

        <button
          class="nav-item"
          [class.nav-item--active]="activeSection() === 'list'"
          (click)="setSection('list')"
        >
          <mat-icon>video_library</mat-icon>
          <span>Watchlist</span>
        </button>
        <button
          class="nav-item"
          [class.nav-item--active]="activeSection() === 'add'"
          (click)="setSection('add')"
        >
          <mat-icon>add</mat-icon>
          <span>Add</span>
        </button>
        <button
          class="nav-item"
          [class.nav-item--active]="activeSection() === 'shared'"
          (click)="setSection('shared')"
        >
          <mat-icon>group</mat-icon>
          <span>Shared</span>
        </button>

        <button class="nav-item nav-item--logout" (click)="logout()">
          <mat-icon>logout</mat-icon>
          <span>Sign out</span>
        </button>
      </nav>

      <main class="content">
        @switch (activeSection()) {
          @case ('list') {
            <app-watchlist-list></app-watchlist-list>
          }
          @case ('add') {
            <app-watchlist-add></app-watchlist-add>
          }
          @case ('shared') {
            <app-watchlist-shared></app-watchlist-shared>
          }
        }
      </main>
    </div>
  } @else {
    <!-- ── Mobile: tab group ──────────────────────────────────────── -->
    <mat-tab-group (selectedTabChange)="onTabChange($event)">
      <mat-tab label="Watchlist">
        <app-watchlist-list></app-watchlist-list>
      </mat-tab>
      <mat-tab label="Add">
        <app-watchlist-add></app-watchlist-add>
      </mat-tab>
      <mat-tab label="Shared">
        <app-watchlist-shared></app-watchlist-shared>
      </mat-tab>
    </mat-tab-group>
  }

  <!-- FAB + chat panel — outside both branches so it floats over everything -->
  <app-watchlist-ai-chat [mode]="chatMode"></app-watchlist-ai-chat>
</div>
